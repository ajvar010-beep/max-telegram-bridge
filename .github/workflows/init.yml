name: Init

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge
  cancel-in-progress: false

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests certifi
      - uses: actions/cache@v4
        with:
          key: max-tg-runtime-state-v2-${{ github.ref_name }}-init-${{ github.run_id }}
          path: state.json
      - run: python setup_cert.py
      - name: Discover chats
        env:
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python bridge.py --init
