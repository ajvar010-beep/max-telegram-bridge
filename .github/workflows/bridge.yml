name: Bridge

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests certifi
      - uses: actions/cache@v4
        with:
          key: max-tg-runtime-state-v2-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            max-tg-runtime-state-v2-${{ github.ref_name }}-
          path: state.json
      - run: python setup_cert.py
      - name: Run bridge
        env:
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python bridge.py --run-for 240
      - name: Restart next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          curl --fail-with-body --silent --show-error --request POST \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bridge.yml/dispatches" \
            --data '{"ref":"${{ github.ref_name }}"}'
