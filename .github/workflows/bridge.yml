name: Bridge

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bridge
  cancel-in-progress: false

env:
  MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests certifi
      - uses: actions/cache@v4
        with:
          key: bridge-state-${{ github.run_number }}
          restore-keys: bridge-state-
          path: |
            state.json
            config.json
      - run: python setup_cert.py
      - run: python bridge.py --run-for 240
      - name: Restart next run
        if: always()
        run: |
          sleep 30
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bridge.yml/dispatches" \
            -d '{"ref":"main"}'
