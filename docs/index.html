<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Панель управления мостом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #000000);
  --hint: var(--tg-theme-hint-color, #707579);
  --accent: var(--tg-theme-button-color, #3390ec);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --section: var(--tg-theme-section-bg-color, #f1f1f1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  padding: 0 0 96px;
}
.hero {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #7b2ff7));
  color: var(--accent-text);
  padding: 20px 18px 18px;
  border-radius: 0 0 22px 22px;
  margin-bottom: 14px;
}
.hero h1 { font-size: 21px; margin-bottom: 3px; }
.hero .sub { font-size: 13px; opacity: .85; }
.wrap { padding: 0 14px; }
section { margin-bottom: 18px; }
h2 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
h2 .count {
  background: var(--section); color: var(--hint);
  border-radius: 999px; font-size: 12px; font-weight: 600; padding: 2px 9px;
}
.card {
  background: var(--section);
  border-radius: 14px;
  padding: 11px 13px;
  margin-bottom: 8px;
}
.row { display: flex; align-items: center; gap: 10px; }
.row.gap { justify-content: space-between; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; flex-shrink: 0; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.name { font-weight: 600; word-break: break-word; }
.uid { color: var(--hint); font-size: 12px; word-break: break-all; }
.empty { color: var(--hint); font-size: 13px; padding: 4px 2px; }
.search {
  width: 100%; border: 0; border-radius: 12px; background: var(--section);
  color: var(--text); font-size: 15px; padding: 11px 13px; font-family: inherit;
  outline: none; margin-bottom: 10px;
}
.search::placeholder { color: var(--hint); }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-top: 9px; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--hint);
  font-size: 13px; font-weight: 600; padding: 7px 4px; border-radius: 8px;
  cursor: pointer; font-family: inherit;
}
.seg button.on { background: var(--accent); color: var(--accent-text); }
.btn {
  display: block; width: 100%; border: 0; border-radius: 12px;
  background: var(--section); color: var(--text);
  font-size: 15px; font-weight: 600; padding: 13px; margin-bottom: 8px;
  cursor: pointer; font-family: inherit; text-align: center;
}
.btn:active { opacity: .7; }
.btn.danger { color: #e53935; }
.btn.small { width: auto; margin: 0; padding: 8px 14px; font-size: 13px; }
.btns2 { display: flex; gap: 8px; }
.btns2 .btn { flex: 1; }
.addrow { display: flex; gap: 8px; }
.addrow input {
  flex: 1; min-width: 0; border: 0; border-radius: 12px; background: var(--section);
  color: var(--text); font-size: 15px; padding: 12px; font-family: inherit; outline: none;
}
.addrow .btn { width: auto; margin: 0; padding: 12px 18px; }
.fixed {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: var(--bg);
  border-top: 1px solid var(--section);
}
.save {
  display: block; width: 100%; border: 0; border-radius: 13px;
  background: var(--accent); color: var(--accent-text);
  font-size: 16px; font-weight: 700; padding: 15px; cursor: pointer; font-family: inherit;
}
.save:active { opacity: .8; }
.status { text-align: center; color: var(--hint); font-size: 12px; margin-top: 6px; min-height: 16px; }
.filterbar { display: flex; gap: 6px; margin-bottom: 10px; }
.chip {
  border: 0; border-radius: 999px; background: var(--section); color: var(--hint);
  font-size: 13px; font-weight: 600; padding: 7px 13px; cursor: pointer; font-family: inherit;
}
.chip.on { background: var(--accent); color: var(--accent-text); }
</style>
</head>
<body>
<div class="hero">
  <h1>🎛 Панель управления</h1>
  <div class="sub" id="sub">Загрузка…</div>
</div>
<div class="wrap">

<section>
  <h2>Участники MAX <span class="count" id="pcount">0</span></h2>
  <input class="search" id="search" type="text" placeholder="Поиск по имени или ID…">
  <div class="filterbar">
    <button class="chip on" data-f="all">Все</button>
    <button class="chip" data-f="nopin">✉️ без закрепа</button>
    <button class="chip" data-f="block">🚫 заблокированы</button>
  </div>
  <div id="senders"></div>
</section>

<section>
  <h2>Закрепы в Telegram</h2>
  <div class="btns2">
    <button class="btn danger" id="unpinLast">Снять последний</button>
    <button class="btn danger" id="unpinAll">Снять все</button>
  </div>
  <div class="status" id="pinStatus"></div>
</section>

<section>
  <h2>Чаты MAX</h2>
  <div id="chats"></div>
  <div class="addrow">
    <input id="chatId" type="text" inputmode="numeric" placeholder="ID чата">
    <button class="btn" id="addChat">Добавить</button>
  </div>
</section>

</div>
<div class="fixed">
  <button class="save" id="save">💾 Сохранить изменения</button>
  <div class="status" id="saveStatus"></div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

var MODES = [
  { key: "", label: "✉️+📌" },
  { key: "nopin", label: "✉️" },
  { key: "block", label: "🚫" }
];

var data = { participants: [], rules: {}, max_chat_ids: [] };
var query = "";
var filter = "all";

function inflate(b64) {
  var std = b64.replace(/-/g, "+").replace(/_/g, "/");
  while (std.length % 4) std += "=";
  var bin = Uint8Array.from(atob(std), function (c) { return c.charCodeAt(0); });
  var ds = new DecompressionStream("deflate");
  return new Response(new Blob([bin]).stream().pipeThrough(ds)).text().then(JSON.parse);
}

function boot() {
  var raw = new URLSearchParams(location.search).get("d");
  if (!raw) { start(); return; }
  var direct = null;
  try { direct = JSON.parse(decodeURIComponent(raw)); } catch (e) {}
  if (direct && typeof direct === "object") { data = direct; start(); return; }
  inflate(raw).then(function (parsed) { data = parsed; start(); })
    .catch(function () { start(); });
}

function start() {
  if (!data.participants) data.participants = [];
  if (!data.rules) data.rules = {};
  if (!data.max_chat_ids) data.max_chat_ids = [];
  document.getElementById("sub").textContent = data.max_chat_ids.length
    ? "Чатов MAX: " + data.max_chat_ids.length + " · участников в списке: " + data.participants.length
    : "Чаты MAX не подключены";
  document.getElementById("pcount").textContent = data.participants.length;
  renderSenders();
  renderChats();
}

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function avatarNode(p) {
  var a = el("div", "avatar");
  var name = p.name || "?";
  if (p.avatar) {
    var img = document.createElement("img");
    img.src = p.avatar;
    img.referrerPolicy = "no-referrer";
    img.onerror = function () { img.remove(); a.textContent = name.charAt(0).toUpperCase(); };
    a.appendChild(img);
    a.appendChild(document.createTextNode(""));
    if (!a.textContent) a.textContent = name.charAt(0).toUpperCase();
  } else {
    a.textContent = name.charAt(0).toUpperCase();
  }
  return a;
}

function renderSenders() {
  var box = document.getElementById("senders");
  box.innerHTML = "";
  var list = data.participants.filter(function (p) {
    var id = String(p.id);
    var rule = data.rules[id] || "";
    if (filter === "nopin" && rule !== "nopin") return false;
    if (filter === "block" && rule !== "block") return false;
    if (query && (p.name || "").toLowerCase().indexOf(query) === -1 && id.indexOf(query) === -1) return false;
    return true;
  });
  if (!list.length) {
    box.appendChild(el("div", "empty", data.participants.length
      ? "Никого не найдено."
      : "Список пуст. Ростер участников обновляется при запуске моста и по команде /app."));
    return;
  }
  list.forEach(function (p) {
    var id = String(p.id);
    var card = el("div", "card");
    var row = el("div", "row");
    row.appendChild(avatarNode(p));
    var left = el("div");
    left.appendChild(el("div", "name", p.name || "Без имени"));
    left.appendChild(el("div", "uid", "ID: " + id));
    row.appendChild(left);
    card.appendChild(row);
    var seg = el("div", "seg");
    var cur = data.rules[id] || "";
    MODES.forEach(function (m) {
      var b = el("button", cur === m.key ? "on" : "", m.label);
      b.onclick = function () {
        if (m.key) data.rules[id] = m.key;
        else delete data.rules[id];
        if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
        renderSenders();
      };
      seg.appendChild(b);
    });
    card.appendChild(seg);
    box.appendChild(card);
  });
}

document.getElementById("search").oninput = function () {
  query = this.value.trim().toLowerCase();
  renderSenders();
};

Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (chip) {
  chip.onclick = function () {
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) { c.classList.remove("on"); });
    chip.classList.add("on");
    filter = chip.dataset.f;
    renderSenders();
  };
});

function renderChats() {
  var box = document.getElementById("chats");
  box.innerHTML = "";
  var ids = data.max_chat_ids || [];
  if (!ids.length) {
    box.appendChild(el("div", "empty", "Список пуст"));
    return;
  }
  ids.forEach(function (cid, i) {
    var card = el("div", "card");
    var row = el("div", "row gap");
    row.appendChild(el("span", "uid", String(cid)));
    var del = el("button", "btn danger small", "Убрать");
    del.onclick = function () {
      data.max_chat_ids.splice(i, 1);
      renderChats();
    };
    row.appendChild(del);
    card.appendChild(row);
    box.appendChild(card);
  });
}

document.getElementById("addChat").onclick = function () {
  var inp = document.getElementById("chatId");
  var v = inp.value.trim();
  if (!/^-?\d+$/.test(v)) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    return;
  }
  v = String(parseInt(v, 10));
  if (data.max_chat_ids.map(String).indexOf(v) === -1) data.max_chat_ids.push(v);
  inp.value = "";
  renderChats();
};

function unpin(kind, label) {
  if (!tg) {
    document.getElementById("pinStatus").textContent = "Доступно только внутри Telegram";
    return;
  }
  tg.sendData(JSON.stringify({ unpin: kind }));
  document.getElementById("pinStatus").textContent = label + " — отправлено боту";
  if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
}

document.getElementById("unpinLast").onclick = function () { unpin("last", "Снятие последнего закрепа"); };
document.getElementById("unpinAll").onclick = function () { unpin("all", "Снятие всех закрепов"); };

document.getElementById("save").onclick = function () {
  if (!tg) {
    document.getElementById("saveStatus").textContent = "Откройте панель из Telegram";
    return;
  }
  var payload = JSON.stringify({ rules: data.rules, max_chat_ids: data.max_chat_ids.map(String) });
  tg.sendData(payload);
  document.getElementById("saveStatus").textContent = "Отправлено боту ✓";
  if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  setTimeout(function () { document.getElementById("saveStatus").textContent = ""; }, 3000);
};

boot();
</script>
</body>
</html>
