<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Секретарь MAX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #000000);
  --hint: var(--tg-theme-hint-color, #707579);
  --accent: var(--tg-theme-button-color, #3390ec);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --section: var(--tg-theme-section-bg-color, #f1f1f1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  padding: 0 0 150px;
}
.hero {
  background: linear-gradient(135deg, #2e9e5b, #1f7a45);
  color: #fff;
  padding: 20px 18px 18px;
  border-radius: 0 0 22px 22px;
  margin-bottom: 14px;
}
.hero h1 { font-size: 21px; margin-bottom: 3px; }
.hero .sub { font-size: 13px; opacity: .88; }
.wrap { padding: 0 14px; }
h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.refresh {
  border: 0; border-radius: 999px; background: var(--section); color: var(--hint);
  font-size: 13px; font-weight: 600; padding: 7px 13px; cursor: pointer; font-family: inherit;
}
.refresh:active { opacity: .7; }
.card {
  background: var(--section);
  border-radius: 14px;
  padding: 12px 13px;
  margin-bottom: 8px;
}
.card .who { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.card .what { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
.atts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.att {
  background: var(--bg); color: var(--hint); border-radius: 999px;
  font-size: 12px; font-weight: 600; padding: 3px 9px;
}
.react {
  border: 0; border-radius: 10px; background: var(--bg); color: var(--accent);
  font-size: 13px; font-weight: 700; padding: 7px 12px; margin-top: 8px;
  cursor: pointer; font-family: inherit;
}
.react:active { opacity: .7; }
.emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.emoji-grid button {
  border: 0; background: var(--bg); border-radius: 10px;
  font-size: 22px; padding: 6px 9px; cursor: pointer; line-height: 1.1;
}
.emoji-grid button:active { transform: scale(.85); }
.empty { color: var(--hint); font-size: 13px; padding: 4px 2px 10px; }
.card .meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.card .time { color: var(--hint); font-size: 12px; font-weight: 500; }
.live-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #2e9e5b;
  display: inline-block; margin-right: 6px; animation: pulse 2s infinite;
}
.live-off { background: var(--hint); animation: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.live-status { font-size: 12px; font-weight: 500; color: var(--hint); display: flex; align-items: center; }
.composer {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: var(--bg);
  border-top: 1px solid var(--section);
}
.composer textarea {
  width: 100%; border: 0; border-radius: 12px; background: var(--section);
  color: var(--text); font-size: 15px; font-family: inherit;
  padding: 12px 13px; resize: none; outline: none; height: 64px;
  margin-bottom: 8px;
}
.composer textarea::placeholder { color: var(--hint); }
.send {
  display: block; width: 100%; border: 0; border-radius: 13px;
  background: var(--accent); color: var(--accent-text);
  font-size: 16px; font-weight: 700; padding: 14px; cursor: pointer; font-family: inherit;
}
.send:active { opacity: .8; }
.toast { text-align: center; color: var(--hint); font-size: 12px; margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>
<div class="hero">
  <h1>📨 Секретарь MAX</h1>
  <div class="sub" id="sub">Загрузка…</div>
</div>
<div class="wrap">
  <h2><span class="live-status"><span class="live-dot live-off" id="liveDot"></span>Последние сообщения MAX</span> <button class="refresh" id="refresh">🔄 Обновить</button></h2>
  <div id="feed"></div>
</div>

<div class="composer">
  <textarea id="text" placeholder="Сообщение в MAX — оно уйдёт с подписью вашего имени…"></textarea>
  <button class="send" id="send">📤 Отправить в MAX</button>
  <div class="toast" id="toast"></div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

var EMOJIS = ["👍", "❤️", "😂", "🔥", "👏", "😮", "😢", "🙏", "✅", "🎉"];
var data = { feed: [], me: "" };

function inflate(b64) {
  var std = b64.replace(/-/g, "+").replace(/_/g, "/");
  while (std.length % 4) std += "=";
  var bin = Uint8Array.from(atob(std), function (c) { return c.charCodeAt(0); });
  var ds = new DecompressionStream("deflate");
  return new Response(new Blob([bin]).stream().pipeThrough(ds)).text().then(JSON.parse);
}

function boot() {
  var raw = new URLSearchParams(location.search).get("d");
  if (!raw) { start(); return; }
  var direct = null;
  try { direct = JSON.parse(decodeURIComponent(raw)); } catch (e) {}
  if (direct && typeof direct === "object") { data = direct; start(); return; }
  inflate(raw).then(function (parsed) { data = parsed; start(); })
    .catch(function () { start(); });
}

var liveTimer = null;
var lastSig = "";

function start() {
  if (!data.feed) data.feed = [];
  document.getElementById("sub").textContent = data.me
    ? "Вы пишете как: " + data.me + " · сообщения и медиа отправятся в MAX"
    : "Ваши сообщения уйдут в MAX";
  renderFeed();
  if (data.live) {
    fetchLive();
    liveTimer = setInterval(fetchLive, 20000);
  }
}

function setLiveDot(on) {
  document.getElementById("liveDot").classList.toggle("live-off", !on);
}

function fetchLive() {
  fetch(data.live + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (live) {
      if (!live || !Array.isArray(live.feed)) return;
      setLiveDot(true);
      var sig = JSON.stringify(live.feed);
      if (sig === lastSig) return;
      lastSig = sig;
      data.feed = live.feed;
      renderFeed();
    })
    .catch(function () { setLiveDot(false); });
}

function fmtTime(ts) {
  if (!ts) return "";
  var d = new Date(ts * 1000);
  return d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function sendPayload(payload, toastText) {
  if (!tg) {
    document.getElementById("toast").textContent = "Откройте секретарь из Telegram";
    return;
  }
  tg.sendData(JSON.stringify(payload));
  if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  var t = document.getElementById("toast");
  t.textContent = toastText;
  setTimeout(function () { t.textContent = ""; }, 3000);
}

function renderFeed() {
  var box = document.getElementById("feed");
  box.innerHTML = "";
  if (!data.feed.length) {
    box.appendChild(el("div", "empty", "Лента пуста — последние пересланные сообщения появятся здесь, и на них можно будет реагировать."));
    return;
  }
  data.feed.forEach(function (item) {
    var card = el("div", "card");
    var meta = el("div", "meta");
    meta.appendChild(el("span", "who", item.name || "Канал"));
    var t = fmtTime(item.ts);
    if (t) meta.appendChild(el("span", "time", t));
    card.appendChild(meta);
    if (item.text) card.appendChild(el("div", "what", item.text));
    if (item.atts && item.atts.length) {
      var chips = el("div", "atts");
      item.atts.forEach(function (a) {
        var icon = { image: "🖼", video: "🎬", audio: "🎵", file: "📎" }[a] || "📎";
        chips.appendChild(el("span", "att", icon + " " + a));
      });
      card.appendChild(chips);
    }
    var btn = el("button", "react", "🙂 Реагировать");
    var grid = null;
    btn.onclick = function () {
      if (grid) { grid.remove(); grid = null; btn.textContent = "🙂 Реагировать"; return; }
      grid = el("div", "emoji-grid");
      EMOJIS.forEach(function (e) {
        var b = el("button", null, e);
        b.onclick = function () {
          sendPayload({ react: { id: item.id, emoji: e } }, e + " реакция отправлена в MAX");
          grid.remove();
          grid = null;
          btn.textContent = "🙂 Реагировать";
        };
        grid.appendChild(b);
      });
      card.appendChild(grid);
      btn.textContent = "Свернуть ▲";
    };
    card.appendChild(btn);
    box.appendChild(card);
  });
}

document.getElementById("send").onclick = function () {
  var t = document.getElementById("text");
  var v = t.value.trim();
  if (!v) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    return;
  }
  sendPayload({ send: v }, "Сообщение передано боту");
  t.value = "";
};

document.getElementById("refresh").onclick = function () {
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  if (data.live) {
    fetchLive();
    var t = document.getElementById("toast");
    t.textContent = "Лента обновляется автоматически каждые 20 секунд";
    setTimeout(function () { t.textContent = ""; }, 3000);
  } else {
    sendPayload({ refresh: true }, "Обновляем ленту…");
  }
};

boot();
</script>
</body>
</html>
